# eidos_agent/features/firmament/configs/npc_profiles.yaml
# Defines profiles for Non-Player Characters (NPCs).

mailman_bob:
  id: "mailman_bob"
  name: "Mailman Bob"
  description: "The regular, cheerful mail carrier."
  default_mood: "pleasant"
  # Simplified dialogue_lines for event-based triggering
  dialogue_lines:
    greeting_general:
      - "Hello there!"
      - "Good day to you."
    event_mail_delivery: # Key matches event_name for specific dialogue
      - "Mail's here!"
      - "Special delivery today!"
      - "Just the usual today."
    event_stranger_dog_barks: # Example of reacting to another event
      - "Was that a dog barking? Sounded close."
  presence_trigger_events: # Events that can make this NPC 'appear' or 'relevant'
    - "mail_delivery"       # This is an event_name from a WORLD_EVENT
    - "stranger_dog_barks"  # Another event_name

neighbor_alice:
  id: "neighbor_alice"
  name: "Neighbor Alice"
  description: "A friendly neighbor who enjoys gardening."
  default_mood: "friendly"
  dialogue_lines:
    greeting_general:
      - "Hi there, Pathos!"
      - "Lovely day, isn't it?"
      - "How are you doing today?"
    event_neighbor_starts_lawnmower: # Specific event
      - "Oh, sounds like someone's mowing their lawn."
      - "There goes the lawnmower again!"
    event_pathos_is_outside: # Hypothetical future event
      - "Enjoying the weather, Pathos?"
  presence_trigger_events:
    - "neighbor_starts_lawnmower" # Assumed to be an event_name from a WORLD_EVENT
    - "pathos_is_outside"       # A hypothetical custom event for future use

barista_tom:
  id: "barista_tom"
  name: "Barista Tom"
  description: "The efficient barista at the local coffee shop."
  default_mood: "focused"
  dialogue_lines:
    greeting_general: # Generic greeting if Pathos is e.g. at coffee shop location
      - "Hi, what can I get for you?"
      - "Welcome! The usual?"
    event_pathos_orders_coffee: # Hypothetical custom event
      - "One large latte, coming right up!"
      - "That'll be $4.50, please."
  presence_trigger_events:
    - "pathos_enters_coffee_shop" # Hypothetical custom event
    - "coffee_machine_hiss"       # Hypothetical world event
