[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eidos"
version = "0.1.0"
description = "A local-first persistent digital person simulation"
requires-python = ">=3.12"
authors = [{ name = "Isaac Lamb" }]
dependencies = []

[project.scripts]
eidos = "eidos.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eidos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
